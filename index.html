<!doctype html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon Package -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA / Browser -->
    <meta name="theme-color" content="#5b5ceb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrepRoute" />

    <!-- SEO -->
    <title>PrepRoute — Test Management System</title>
    <meta name="description" content="PrepRoute is a modern test management platform for creating, scheduling, and analysing assessments with precision." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PrepRoute — Test Management System" />
    <meta property="og:description" content="Create, manage, and publish assessments with a production-ready test management dashboard." />
    <meta property="og:image" content="/icon-512x512.png" />
    <meta property="og:site_name" content="PrepRoute" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PrepRoute — Test Management System" />
    <meta name="twitter:description" content="Create, manage, and publish assessments with a production-ready test management dashboard." />
    <meta name="twitter:image" content="/icon-512x512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        var errorDiv = document.getElementById('debug-error');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error';
          errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:20px;z-index:999999;font-family:monospace;border-bottom:3px solid #ef4444;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(errorDiv);
        }
        errorDiv.textContent += '\nUncaught Error: ' + (e.error ? e.error.stack || e.error.message || e.error : e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errorDiv = document.getElementById('debug-error');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error';
          errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:20px;z-index:999999;font-family:monospace;border-bottom:3px solid #ef4444;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(errorDiv);
        }
        errorDiv.textContent += '\nUnhandled Promise Rejection: ' + (e.reason ? e.reason.stack || e.reason.message || e.reason : e);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
