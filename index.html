<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>PrepRoute</title>
    <script>
      window.addEventListener('error', function(e) {
        var errorDiv = document.getElementById('debug-error');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error';
          errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:20px;z-index:999999;font-family:monospace;border-bottom:3px solid #ef4444;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(errorDiv);
        }
        errorDiv.textContent += '\nUncaught Error: ' + (e.error ? e.error.stack || e.error.message || e.error : e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errorDiv = document.getElementById('debug-error');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error';
          errorDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:20px;z-index:999999;font-family:monospace;border-bottom:3px solid #ef4444;white-space:pre-wrap;overflow:auto;max-height:50vh;';
          document.body.appendChild(errorDiv);
        }
        errorDiv.textContent += '\nUnhandled Promise Rejection: ' + (e.reason ? e.reason.stack || e.reason.message || e.reason : e);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
